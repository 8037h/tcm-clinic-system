{% extends 'base.html' %}
{% block title %}删除{{ object_title }}{% endblock %}
{% block content %}
<div class="confirm-wrap card"><p class="eyebrow">DELETE RECORD</p><h1>确认删除{{ object_title }}？</h1>
  <p>即将删除 <strong>{{ object }}</strong>。此操作无法撤销。</p>
  <form method="post" class="button-group">{% csrf_token %}<a class="btn btn-quiet" href="{% url detail_url object.pk %}">取消</a><button class="btn btn-danger" type="submit">确认删除</button></form>
</div>
{% endblock %}
