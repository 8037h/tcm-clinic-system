{% extends 'base.html' %}
{% block title %}登录{% endblock %}
{% block content %}
<div class="auth-wrap card"><h1>登录</h1>
  {% if form.errors %}<div class="form-errors">用户名或密码不正确。</div>{% endif %}
  <form method="post" novalidate>{% csrf_token %}
    <div class="field"><label for="id_username">用户名</label>{{ form.username }}</div>
    <div class="field"><label for="id_password">密码</label>{{ form.password }}</div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary" type="submit">登录</button>
  </form>
  <p class="muted">还没有账号？<a href="{% url 'register' %}">注册普通用户</a></p>
</div>
{% endblock %}
