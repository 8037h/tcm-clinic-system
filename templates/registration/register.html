{% extends 'base.html' %}
{% block title %}注册{% endblock %}
{% block content %}
<div class="auth-wrap card"><h1>注册普通用户</h1>
  <form method="post" novalidate>{% csrf_token %}
    {% for field in form %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="error-text">{{ error }}</div>{% endfor %}</div>{% endfor %}
    <button class="btn btn-primary" type="submit">注册</button>
  </form>
  <p class="muted">已有账号？<a href="{% url 'login' %}">返回登录</a></p>
</div>
{% endblock %}
